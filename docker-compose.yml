# This docker-compose.yml is for LOCAL DEVELOPMENT ONLY — not for production (FR-036)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shophub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: shophub:dev
    # Override CMD for local dev — use Django's runserver for live reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount source code for live reload (overrides COPY in Dockerfile)
      - .:/app
      # Persist media uploads across container restarts
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/shophub
    depends_on:
      db:
        condition: service_healthy

volumes:
  media_data:
  db_data:
