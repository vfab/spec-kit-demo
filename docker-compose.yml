services:
  web:
    build: .
    image: shophub:dev
    # Override CMD for local dev — use Django's runserver for live reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount source code for live reload (overrides COPY in Dockerfile)
      - .:/app
      # Persist media uploads across container restarts
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on: []

volumes:
  media_data:
