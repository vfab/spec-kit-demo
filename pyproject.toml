[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    migrations
  | \.venv
  | \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_django = ["django"]
known_first_party = ["accounts", "orders", "products", "ecommerce_site"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*", ".venv/*"]

[tool.coverage.run]
parallel = true
omit = [
    "tests/e2e/*",
    "tests/load/*",
    "*/migrations/*",
    "ecommerce_site/wsgi.py",
    "ecommerce_site/asgi.py",
]

[tool.pydocstyle]
convention = "google"
# D1xx: missing docstrings — not enforced (many internal methods legitimately lack them)
# D107: missing docstring in __init__ — noisy for Django class-based views
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
match-dir = "^(?!migrations|tests|\\.venv).*"
