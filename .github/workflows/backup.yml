name: Automated Database Backup

on:
  # Schedule is intentionally disabled until the production Fly.io app and R2
  # bucket are provisioned and the required secrets/vars are configured in
  # GitHub repository settings (FLY_API_TOKEN, FLY_PRODUCTION_APP,
  # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_ENDPOINT_URL).
  # Re-enable before production go-live — see docs/go-live-checklist.md.
  #
  # schedule:
  #   - cron: "0 2 * * *"  # Daily at 02:00 UTC
  workflow_dispatch:  # Manual trigger (use to verify once secrets are set)

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run backup script inside production VM
        # Secrets are passed as environment variables into the SSH session.
        # They are never printed or logged.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLY_PRODUCTION_APP: ${{ vars.FLY_PRODUCTION_APP }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
        run: |
          flyctl ssh console \
            --app "$FLY_PRODUCTION_APP" \
            -C "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID \
                AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY \
                R2_BUCKET=$R2_BUCKET \
                R2_ENDPOINT_URL=$R2_ENDPOINT_URL \
                ./scripts/backup_db.sh"
